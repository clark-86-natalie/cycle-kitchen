<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;-webkit-text-size-adjust:100%}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<title>Cycle Kitchen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Work+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-width column. Light = fresh warm off-white with the phase colour in cards and buttons; dark = near-black with the phase colour as a glowing accent. html[data-ck] holds light/dark, html[data-phase] the cycle phase. */
:root{
  --bg:#FBF6F1;--surface:#FFFFFF;--fg:#2B1D16;--muted:#6F5E54;--line:rgba(43,29,22,.12);--title:#2B1D16;
  --surface2:#FBE6DA;--accent:#D9622B;--on-accent:#FFFFFF;--hi:#F6CDB4;--on-hi:#4A1F0B;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Work Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px;
}
:root[data-phase="menstrual"]{--surface2:#EEE8FA;--accent:#6F52C2;--on-accent:#FFFFFF;--hi:#DCD2F5;--on-hi:#2E2155}
:root[data-phase="follicular"]{--surface2:#E4F2E7;--accent:#2F7D46;--on-accent:#FFFFFF;--hi:#CBE8D2;--on-hi:#163A21}
:root[data-phase="ovulation"]{--surface2:#FFF4CF;--accent:#F2B705;--on-accent:#2B1D16;--hi:#FFE27F;--on-hi:#3A2A00}
:root[data-phase="luteal"]{--surface2:#FBE6DA;--accent:#D9622B;--on-accent:#FFFFFF;--hi:#F6CDB4;--on-hi:#4A1F0B}
:root[data-ck="dark"]{--bg:#141113;--surface:#1E191B;--fg:#F2E8E4;--muted:#B3A39E;--line:rgba(242,232,228,.12);
  --surface2:#2A2325;--accent:#E58A4E;--on-accent:#141113;--hi:#3D2416;--on-hi:#FBD9C3;--title:var(--accent);color-scheme:dark}
:root[data-ck="dark"][data-phase="menstrual"]{--accent:#A98BE0;--hi:#2B2440;--on-hi:#E4DBFA}
:root[data-ck="dark"][data-phase="follicular"]{--accent:#7FBF8A;--hi:#1C3122;--on-hi:#D7F0DC}
:root[data-ck="dark"][data-phase="ovulation"]{--accent:#F0C24B;--hi:#382E10;--on-hi:#FCEBB8}
:root[data-ck="dark"][data-phase="luteal"]{--accent:#E58A4E;--hi:#3D2416;--on-hi:#FBD9C3}
*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;transition:background .5s ease,color .5s ease}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;line-height:1.1;letter-spacing:-.01em}
h1{font-size:2.1rem;letter-spacing:-.025em}h2{font-size:1.35rem}h3{font-size:1.1rem}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-lg{display:flex;flex-direction:column;gap:20px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.label{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.card{background:var(--surface);border-radius:var(--r);padding:16px;min-width:0}
:root[data-ck="dark"] .card:not(.hi):not(.soft){box-shadow:inset 0 0 0 1px var(--line)}
.card.soft{background:var(--surface2)}
.card.hi{background:var(--hi);color:var(--on-hi)}
.card.hi .label,.card.hi .muted{color:var(--on-hi);opacity:.85}
button,input,select{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.btn{appearance:none;border:0;border-radius:999px;padding:12px 20px;background:var(--accent);color:var(--on-accent);font-weight:600;cursor:pointer;text-align:center}
.btn.ghost{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.small{padding:8px 16px;font-size:.9rem;min-height:44px}
.btn{min-height:48px;display:inline-flex;align-items:center;justify-content:center}
.btn.block{width:100%}
.btn:focus-visible,.chip:focus-visible,.tab:focus-visible,.food summary:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip{appearance:none;border:0;border-radius:999px;padding:8px 16px;min-height:44px;background:var(--surface2);color:var(--fg);font-size:.9rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.link{appearance:none;background:none;border:0;padding:0;min-height:44px;display:inline-flex;align-items:center;color:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-weight:500}
.sel{appearance:none;background:var(--surface2);border:0;border-radius:12px;padding:10px 40px 10px 12px;width:100%;min-height:48px;font-size:16px;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 14px) 21px;background-size:6px 6px;background-repeat:no-repeat}
.sel:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=date],input[type=text],input[type=number]{background:var(--surface2);border:0;border-radius:12px;padding:10px 12px;width:100%;min-width:0;min-height:48px;font-size:16px}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}
.brand{font-family:var(--display);font-weight:800;font-size:1.15rem;letter-spacing:-.02em}
.avatar{width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--surface2)}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface2);border-radius:var(--r);padding:12px 14px;margin-bottom:16px;font-size:.9rem}

.hero{padding:8px 0 4px}
.hero .day{font-family:var(--display);font-weight:800;font-size:3.6rem;line-height:.95;letter-spacing:-.035em;color:var(--title)}
.strip{display:grid;gap:2px;height:10px;margin-top:14px;border-radius:999px;overflow:hidden}
.strip span{display:block}
.strip .m{background:#8C79C9}.strip .f{background:#6FA052}.strip .o{background:#F2B21B}.strip .l{background:#C2652B}
.strip .now{box-shadow:inset 0 0 0 2px var(--fg)}
.legend{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted);margin-top:6px}

.food{border-top:1px solid var(--line)}
.food:first-of-type{border-top:0}
.food summary{list-style:none;display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:12px 0;cursor:pointer}
.food summary::-webkit-details-marker{display:none}
.food .nm{font-weight:600}
.food .why{font-size:.875rem;color:var(--muted)}
.food .more{font-size:.8rem;white-space:nowrap;color:var(--muted)}
.food[open] .more{color:var(--fg)}
.food ul{margin:0 0 12px;padding-left:18px;font-size:.9rem}
.food ul li+li{margin-top:4px}
.tag{display:inline-block;font-size:.7rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);margin-left:6px;vertical-align:2px}

.grp{padding:16px 0;border-top:1px solid var(--line)}
.grp:first-of-type{border-top:0}
.grp .why{font-size:.92rem;color:var(--muted);margin:4px 0 12px}
.fchips{display:flex;flex-wrap:wrap;gap:8px}
.fchip{appearance:none;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 12px 8px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface2);color:var(--fg);font-weight:500;cursor:pointer;text-align:left}
.fchip svg{width:16px;height:16px;flex:none;transition:transform .2s ease}
.fchip[aria-expanded="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.fchip[aria-expanded="true"] svg{transform:rotate(45deg)}
.fchip:focus-visible,.recipe-row:focus-visible,.article-card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fdetail{background:var(--surface2);border-radius:14px;padding:14px;margin-top:12px}
.recipe-row{appearance:none;border:0;width:100%;display:flex;justify-content:space-between;gap:12px;align-items:center;background:var(--surface);color:var(--fg);border-radius:12px;padding:12px 14px;min-height:52px;cursor:pointer;text-align:left;font:inherit}
.hint{display:flex;gap:8px;align-items:center;font-size:.875rem;color:var(--muted);margin:6px 0 2px}
.hint-dot{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);flex:none}
.hint-dot svg{width:12px;height:12px}
.next .pill{background:color-mix(in srgb,var(--on-hi) 16%,transparent);border-radius:999px;padding:4px 10px;font-size:.85rem}
.article-card{padding:0;overflow:hidden;appearance:none;border:0;width:100%;text-align:left;color:inherit;cursor:pointer;display:block;font:inherit}
.article-card .art{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;object-position:50% 35%;max-width:100%}
.article-card .body{display:flex;padding:16px}
.h3{font-family:var(--display);font-weight:700;font-size:1.25rem;line-height:1.2}
.article p{max-width:65ch}
.article .lede{font-size:1.1rem}
.article h2{font-size:1.3rem}
.welcome h1{font-size:2.3rem}
.feats{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.feats li{display:flex;gap:12px;align-items:center}
.feats .fd{width:22px;height:22px;border-radius:50%;flex:none}
.next{display:flex;flex-wrap:wrap;gap:6px}
.next span{background:var(--surface);border-radius:999px;padding:4px 10px;font-size:.85rem}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:8px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;align-items:center}
.tab{appearance:none;border:0;background:none;color:var(--muted);font-size:.7rem;padding:4px 0;min-height:56px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.tab .ic{display:grid;place-items:center;width:52px;height:30px;border-radius:999px;transition:background .2s ease}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--fg);font-weight:600}
.tab[aria-current="page"] .ic{background:var(--hi);color:var(--on-hi)}
.tab[aria-current="page"] svg{stroke-width:2.3}
.tab.log{color:var(--on-accent)}
.tab.log span.dot{width:44px;height:44px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-size:1.6rem;line-height:1;margin-top:-18px}

.sheet-wrap{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:88vh;max-height:88dvh;overscroll-behavior:contain;overflow:auto;border-radius:22px 22px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.grip{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg .chip{border-radius:12px;padding:10px 4px}
.toast{pointer-events:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.9rem}

.steps{display:flex;gap:6px;margin-bottom:6px}
.steps span{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps span.on{background:var(--accent)}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;appearance:none;border:0;background:var(--surface);border-radius:var(--r);padding:14px 16px;cursor:pointer}
.opt[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--accent)}
.opt b{display:block;font-weight:600}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:18px;text-align:center}
table.hist{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.9rem}
table.hist td,table.hist th{padding:8px 0;border-top:1px solid var(--line);text-align:left}
table.hist th{font-weight:600;color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;border-top:0}
table.hist td:last-child,table.hist th:last-child{text-align:right}
.clean{margin:0;padding-left:20px}
.clean li+li{margin-top:6px}
.stat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat .card .v{font-family:var(--display);font-size:1.5rem;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){body{transition:none}}
</style>

<div class="app" id="app" aria-live="polite">
  <div class="top"><span class="brand">Cycle Kitchen</span></div>
  <p class="muted">Loading your kitchen…</p>
</div>

<script>
(function(){
"use strict";
const inClaude=!!(window.claude&&window.claude.use);

/* ---------- dates ---------- */
const DAY=86400000;
const iso=d=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};
const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>iso(new Date(parse(s).getTime()+n*DAY+3600000));
const diff=(a,b)=>Math.round((parse(a)-parse(b))/DAY);
const todayISO=()=>iso(new Date());
const fmt=(s,o)=>parse(s).toLocaleDateString("en-GB",o||{day:"numeric",month:"short"});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- content ---------- */
const PHASES={
  menstrual:{name:"Menstrual",short:"m",mood:"Rest and replenish",
    great:"Go easy on yourself. A walk, gentle yoga or a stretch is plenty, and an early night counts as self-care.",
    sleep:"You might need extra rest right now. Your body is doing a lot, so an earlier bedtime will help.",
    seeds:"Flax and pumpkin"},
  follicular:{name:"Follicular",short:"f",mood:"Energy is rising",
    great:"Energy is building. A good time to try something new, plan the month ahead or step up your training.",
    sleep:"Sleep usually feels easier in this phase. Keep a steady bedtime to bank good rest.",
    seeds:"Flax and pumpkin"},
  ovulation:{name:"Ovulation",short:"o",mood:"Peak energy",
    great:"Energy's high. A great time for a tough strength session, a big conversation or seeing friends.",
    sleep:"You may feel you need less sleep, but late nights now can catch up with you next phase.",
    seeds:"Sesame and sunflower"},
  luteal:{name:"Luteal",short:"l",mood:"Slowing down",
    great:"Ease the pace as this phase goes on. Strength work and steady walks suit early luteal; gentler movement later.",
    sleep:"Finding it harder to sleep? Falling progesterone and a slightly higher body temperature can do that before your period. Magnesium-rich foods and a cooler bedroom can help.",
    seeds:"Sesame and sunflower"}
};
const ORDER=["menstrual","follicular","ovulation","luteal"];

/* Food groups per phase: each group says what it helps and why, then the foods. Tags: allergens + meat/fish/dairy/egg. */
const R=(title,time,serves,t,ing,steps)=>({title,time,serves,t,ing,steps});
const GROUPS={
  menstrual:[
    {title:"Top up your iron",why:"You lose iron when you bleed. Topping it up helps fight the tiredness that often comes with your period.",foods:[
      {n:"Lentils",why:"Iron, protein and fibre",t:[],w:["Red lentil dhal","Stirred into soups and stews","Lentil and sweet potato curry"],
        r:R("Red lentil and spinach dhal","30 min",4,[],["250g red lentils","1 onion, chopped","3 garlic cloves, crushed","Thumb of ginger, grated","1 tbsp curry powder","400ml tin coconut milk","2 big handfuls of spinach"],["Soften the onion in a little oil for 5 minutes, then stir in the garlic, ginger and curry powder for 1 minute.","Add the lentils, coconut milk and 500ml water. Simmer for 20 minutes, stirring now and then, until soft.","Stir in the spinach until it wilts, season, and serve with rice or flatbread."])},
      {n:"Red meat",why:"The iron your body absorbs most easily",t:["meat"],w:["Beef stew","Lean mince in a ragu","Steak with greens"],
        r:R("Beef and bean chilli","45 min",4,["meat"],["500g lean beef mince","1 onion, chopped","2 garlic cloves","1 tbsp chilli powder","1 tsp ground cumin","400g tin chopped tomatoes","400g tin kidney beans, drained"],["Brown the mince in a large pan, then add the onion and cook for 5 minutes.","Stir in the garlic and spices for 1 minute, then add the tomatoes and beans.","Simmer for 30 minutes until thick. Serve with rice, jacket potatoes or wraps."])},
      {n:"Spinach and dark greens",why:"Iron, folate and magnesium",t:[],w:["Wilted into eggs or pasta","Blended into a smoothie","Sautéed with garlic"]}
    ]},
    {title:"Ease cramps",why:"Magnesium helps muscles relax, while ginger and omega-3s calm the inflammation behind period pain.",foods:[
      {n:"Ginger",why:"Can ease cramps and nausea",t:[],w:["Fresh ginger tea","Grated into stir-fries","Added to soups"]},
      {n:"Salmon or mackerel",why:"Omega-3s to calm inflammation",t:["fish"],w:["Baked with lemon","Smoked salmon on toast","Mackerel salad"],
        r:R("Ginger and lime salmon traybake","25 min",2,["fish"],["2 salmon fillets","1 head of broccoli, in florets","Thumb of ginger, grated","1 lime","1 tbsp honey","1 tbsp olive oil"],["Heat the oven to 200°C (180°C fan). Toss the broccoli in the oil on a tray and roast for 8 minutes.","Mix the ginger, honey, lime zest and juice. Add the salmon to the tray and spoon the mix over.","Roast for 12 to 15 minutes until the salmon flakes easily."])},
      {n:"Dark chocolate (70%+)",why:"Magnesium for cramps and mood",t:[],w:["A couple of squares after dinner, or more if that's what you fancy","Melted over berries","In a mug of hot chocolate"]},
      {n:"Almonds",why:"Magnesium and vitamin E",t:["nuts"],w:["A handful as a snack","Almond butter on toast"]}
    ]},
    {title:"Support your hormones",seeds:1,why:"Flaxseed contains plant compounds that help your body keep oestrogen in balance, and pumpkin seeds are rich in zinc, which supports healthy ovulation later in your cycle.",
      swapWhy:"Chickpeas give you gentle plant oestrogens, and zinc from lentils or beef supports healthy ovulation later in your cycle.",foods:[
      {n:"Ground flaxseed",why:"About 1 tablespoon a day",t:["seeds"],seed:1,w:[["Stirred into Greek yoghurt with fruit",["dairy"]],"Blended into a smoothie","Mixed into porridge"],
        r:R("Flax and berry overnight oats","5 min, plus overnight",1,["seeds","gluten","dairy"],["40g oats","1 tbsp ground flaxseed","1 tbsp pumpkin seeds","100g Greek yoghurt","100ml milk","A handful of berries"],["Mix the oats, flaxseed, yoghurt and milk in a jar.","Cover and leave in the fridge overnight.","Top with berries and pumpkin seeds in the morning."])},
      {n:"Pumpkin seeds",why:"About 1 tablespoon a day",t:["seeds"],seed:1,w:["Toasted as a snack","Sprinkled on soup or salad","Blended into a smoothie"]},
      {n:"Chickpeas",why:"Gentle plant oestrogens and fibre",t:[],swap:1,w:["Hummus with veg","Roasted with spices","In a warm salad"]},
      {n:"Lentils or beef",why:"Zinc",t:[],swap:1,w:["Lentil soup","Beef stir-fry"]}
    ]}
  ],
  follicular:[
    {title:"Keep oestrogen balanced",why:"Oestrogen is rising. Cruciferous veg and fibre help your liver and gut process it, so levels stay balanced.",foods:[
      {n:"Broccoli and cruciferous veg",why:"Help your body process oestrogen",t:[],w:["Roasted with olive oil","Stir-fried with garlic","Blitzed into soup"],
        r:R("Garlic broccoli and chickpea traybake","30 min",2,[],["1 head of broccoli, in florets","400g tin chickpeas, drained","1 red onion, in wedges","2 garlic cloves, sliced","2 tbsp olive oil","1 tsp smoked paprika","1 lemon"],["Heat the oven to 200°C (180°C fan).","Toss everything except the lemon on a tray with salt and pepper.","Roast for 25 minutes, then squeeze over the lemon. Good with rice or flatbread."])},
      {n:"Fermented foods",why:"A healthy gut helps clear used oestrogen",t:[],w:["Sauerkraut on the side","Kimchi in rice bowls",["Kefir in a smoothie",["dairy"]]]},
      {n:"Oats",why:"Fibre and slow-release energy",t:["gluten"],w:["Overnight oats","Porridge with berries"]}
    ]},
    {title:"Fuel your rising energy",why:"Energy is building. Protein and healthy fats keep you full and help your muscles make the most of training.",foods:[
      {n:"Eggs",why:"Protein and choline",t:["egg"],w:["Veggie omelette","Boiled as a snack","Shakshuka"],
        r:R("Veggie shakshuka","25 min",2,["egg"],["1 onion, sliced","1 red pepper, sliced","2 garlic cloves","1 tsp cumin and 1 tsp paprika","400g tin chopped tomatoes","4 eggs","A handful of spinach"],["Soften the onion and pepper in oil for 8 minutes, then add the garlic and spices for 1 minute.","Pour in the tomatoes and simmer for 5 minutes. Stir in the spinach.","Make 4 hollows, crack in the eggs, cover and cook for 6 to 8 minutes until set to your liking."])},
      {n:"Chicken",why:"Lean protein",t:["meat"],w:["Traybake with veg","In wraps","Chicken salad"]},

/* ---------- prediction ---------- */
function analyse(st){
  const t=todayISO();
  const ps=(st.periods||[]).filter(p=>p.start&&p.start<=t).sort((a,b)=>a.start<b.start?-1:1);
  if(!ps.length)return null;
  const lens=[];for(let i=1;i<ps.length;i++){const d=diff(ps[i].start,ps[i-1].start);if(d>=18&&d<=50)lens.push(d)}
  const recent=lens.slice(-6);
  let avg=28,sd=0;
  if(recent.length){let wsum=0,tot=0;recent.forEach((l,i)=>{wsum+=(i+1)*l;tot+=i+1});avg=Math.round(wsum/tot);
    const m=recent.reduce((a,b)=>a+b,0)/recent.length;sd=Math.sqrt(recent.reduce((a,b)=>a+(b-m)*(b-m),0)/recent.length)}
  const pl=ps.filter(p=>p.end).map(p=>diff(p.end,p.start)+1).filter(x=>x>=2&&x<=10);
  const periodLen=pl.length?Math.round(pl.slice(-6).reduce((a,b)=>a+b,0)/Math.min(pl.length,6)):(st.periodLen||5);
  const last=ps[ps.length-1];
  const day=diff(t,last.start)+1;
  const ovDay=Math.max(10,avg-14);
  const ends={menstrual:periodLen,follicular:ovDay-2,ovulation:ovDay+1,luteal:avg};
  let phase;
  const openPeriod=!last.end&&day<=10;
  if(day<=periodLen||openPeriod)phase="menstrual";
  else if(day<ovDay-1)phase="follicular";
  else if(day<=ovDay+1)phase="ovulation";
  else phase="luteal";
  const irregular=sd>7||(st.stage==="peri"&&sd>4);
  const spread=Math.max(2,Math.round(sd));
  const nextStart=addDays(last.start,avg);
  return {day,avg,sd,periodLen,phase,ovDay,ovDate:addDays(last.start,ovDay-1),nextStart,
    daysLeft:Math.max(0,ends[phase]-day),late:day>avg,
    irregular,range:[addDays(nextStart,-spread),addDays(nextStart,spread)],lastStart:last.start,count:ps.length,lens};
}

/* ---------- filtering ---------- */
function blocked(tags){
  const a=new Set(S.allergies||[]);const d=new Set(S.diets||[]);
  tags=tags||[];
  for(const t of tags){
    if(a.has(t))return true;
    if(t==="meat"&&(d.has("vegetarian")||d.has("vegan")||d.has("pescatarian")))return true;
    if(t==="fish"&&(d.has("vegetarian")||d.has("vegan")))return true;
    if((t==="dairy"||t==="egg")&&d.has("vegan"))return true;
    if(t==="dairy"&&d.has("dairyfree"))return true;
  }
  return false;
}

  const av=store.me&&store.me.avatarUrl?`<img class="avatar" alt="" src="${esc(store.me.avatarUrl)}">`:"";
  return `<div class="top"><span class="brand">Cycle Kitchen</span>${av}</div>`;
}
function strip(a){
  const n=Math.max(a.avg,a.day);let h="";
  for(let d=1;d<=n;d++){let c=d<=a.periodLen?"m":d<a.ovDay-1?"f":d<=a.ovDay+1?"o":"l";h+=`<span class="${c}${d===a.day?" now":""}" title="Day ${d}"></span>`}
  return `<div class="strip" style="grid-template-columns:repeat(${n},1fr)" role="img" aria-label="Cycle day ${a.day} of about ${a.avg}">${h}</div><div class="legend"><span>Day 1</span><span>Ovulation ~ day ${a.ovDay}</span><span>Day ${a.avg}</span></div>`;
}
const PLUS='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>';
function foodSection(phase){
  return groupsFor(phase).map(g=>{
    const open=g.foods.find(f=>f.key===ui.food);
    return `<div class="grp"><h3>${esc(g.title)}</h3><p class="why">${esc(g.why)}</p>
      <div class="fchips">${g.foods.map(f=>`<button class="fchip" data-food="${f.key}" aria-expanded="${f.key===ui.food}">${esc(f.n)}${PLUS}</button>`).join("")}</div>
      ${open?`<div class="fdetail stack"><div><b>${esc(open.n)}</b><p class="small muted">${esc(open.why)}</p></div>
        <div><span class="label">Quick ideas</span><ul class="clean small" style="margin-top:6px">${waysFor(open).map(w=>`<li>${esc(w)}</li>`).join("")}</ul></div>
        ${recipeOk(open)?`<button class="recipe-row" data-recipe="${open.key}"><span><span class="label" style="display:block">Recipe</span>${esc(open.r.title)}</span><span class="small muted" style="white-space:nowrap">${esc(open.r.time.split(",")[0])} ›</span></button>`:""}
      </div>`:""}
      ${g.seeds&&!seedFree()?`<button class="link small" data-act="article">What is seed cycling?</button>`:""}
    </div>`}).join("");
}

/* ---------- views ---------- */
function viewToday(){
  const a=analyse(S);
  if(!a){setPhase("");return header()+`<div class="card stack"><h2>Add a period to get started</h2><p class="muted">Log the start date of your last period, or import your history from another app.</p><button class="btn" data-act="log">Log a period</button></div>`}
  setPhase(a.phase);
  const P=PHASES[a.phase];const nx=ORDER[(ORDER.indexOf(a.phase)+1)%4];
  const t=todayISO();const lg=(S.logs||{})[t]||{};
  const syms=(lg.symptoms||[]).filter(k=>k!=="sleep").map(k=>SYMPTOMS.find(s=>s.k===k)).filter(Boolean);
  if(lg.sleep==="bad")syms.push(SYMPTOMS.find(s=>s.k==="sleep"));
  let left;
  if(a.phase==="luteal"&&a.late)left=a.irregular?"Your period could start any day":"Your period is due, it could start any day";
  else left=a.daysLeft<=0?"Last day of this phase":`About ${a.daysLeft} day${a.daysLeft===1?"":"s"} left in this phase`;
  const symCard=syms.length?`<section class="card hi stack" aria-label="For what you logged"><span class="label">Because you logged ${esc(syms.map(s=>s.n.toLowerCase()).join(" and "))}</span>${syms.map(s=>`<div class="stack" style="gap:6px">${syms.length>1?`<b class="small">${esc(s.n)}</b>`:""}<p class="small">${esc(s.why)}</p><div class="next">${s.f.map(x=>Array.isArray(x)?x:[x,[]]).filter(x=>!blocked(x[1])).map(x=>`<span class="pill">${esc(x[0])}</span>`).join("")}</div></div>`).join("")}</section>`:"";
  const notTaken=SUPPS.filter(s=>s.nudge&&!(S.supps||[]).includes(s.k)&&(s.phase.includes(a.phase)||(s.k==="vitd"&&[9,10,11,0,1,2].includes(new Date().getMonth()))));
  const supp=notTaken[0];
  const checkDue=(S.supps||[]).length&&(!S.suppCheck||diff(t,S.suppCheck)>=30);
  const periMode=S.stage==="peri"||a.irregular;
  return header()+`
  <section class="hero stack" aria-label="Today">
    <span class="label">${fmt(t,{weekday:"long",day:"numeric",month:"long"})}</span>
    <div><div class="day">${esc(P.name)}</div><p class="muted" style="margin-top:6px">Day ${a.day} of your cycle · ${esc(P.mood)}</p></div>
    ${strip(a)}

/* ---------- import ---------- */
function toDate(v){
  if(v==null)return null;
  if(typeof v==="number"){const ms=v>1e12?v:v>1e9?v*1000:null;if(!ms)return null;const d=new Date(ms);return isNaN(d)?null:iso(d)}
  if(typeof v!=="string")return null;
  const m=v.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[1]+"-"+m[2]+"-"+m[3];
  const u=v.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{4})/);if(u)return u[3]+"-"+u[2].padStart(2,"0")+"-"+u[1].padStart(2,"0");
  if(/^\d{10,13}$/.test(v))return toDate(+v);
  return null;
}
function mergePeriods(a,b){
  const all=[...(a||[]),...(b||[])].filter(p=>p&&p.start).sort((x,y)=>x.start<y.start?-1:1);
  const out=[];for(const p of all){const last=out[out.length-1];
    if(last&&Math.abs(diff(p.start,last.start))<=3){if(p.end&&(!last.end||p.end>last.end))last.end=p.end}
    else out.push({start:p.start,end:p.end||null})}
  return out;
}
function parseExport(text){
  const found=[];const days=[];
  let json=null;try{json=JSON.parse(text)}catch(e){}
  if(json){
    (function walk(o,ctx){
      if(Array.isArray(o)){o.forEach(x=>walk(x,ctx));return}
      if(!o||typeof o!=="object")return;
      const keys=Object.keys(o);let s=null,e=null;
      for(const k of keys){const kl=k.toLowerCase();const v=o[k];
        if(!s&&/start/.test(kl)&&toDate(v))s=toDate(v);
        else if(!e&&/end/.test(kl)&&toDate(v))e=toDate(v);}
      const typeStr=keys.filter(k=>/type|category|kind|name|event/i.test(k)).map(k=>String(o[k])).join(" ").toLowerCase();
      if(s&&(/period|menstru|cycle|bleed/.test(typeStr+" "+ctx)||/period|menstru/.test(keys.join(" ").toLowerCase()))){found.push({start:s,end:e&&e>=s?e:null})}
      else if(!s&&/period|menstru|bleed|flow/.test(typeStr)){const dk=keys.find(k=>/date|day|time/i.test(k)&&toDate(o[k]));if(dk)days.push(toDate(o[dk]))}
      for(const k of keys){if(o[k]&&typeof o[k]==="object")walk(o[k],ctx+" "+k.toLowerCase())}
    })(json,"");
  }else if(/^\s*</.test(text)){
    appleLines(text.split(/\n/),days);
  }else{
    const lines=text.split(/\r?\n/).filter(l=>l.trim());
    const sep=lines[0]&&lines[0].includes(";")&&!lines[0].includes(",")?";":",";
    const head=(lines[0]||"").toLowerCase().split(sep).map(h=>h.replace(/["']/g,"").trim());
    const dc=head.findIndex(h=>/date|day/.test(h));const pc=head.findIndex(h=>/period|menstru|flow|bleed/.test(h));
    const sc=head.findIndex(h=>/start/.test(h));const ec=head.findIndex(h=>/end/.test(h));
    if(dc>=0&&pc>=0&&pc!==dc){
      lines.slice(1).forEach(l=>{const c=l.split(sep).map(x=>x.replace(/["']/g,"").trim());const v=(c[pc]||"").toLowerCase();
        const d=toDate(c[dc]||"");if(d&&v&&!/^(0|false|no|none|null|nan)$/.test(v)&&!/spot/.test(v))days.push(d)});
    }else if(sc>=0){
      lines.slice(1).forEach(l=>{const c=l.split(sep).map(x=>x.replace(/["']/g,"").trim());const s=toDate(c[sc]||"");const e=ec>=0?toDate(c[ec]||""):null;
        if(s)found.push({start:s,end:e&&e>=s?e:null})});
    }else{
      lines.forEach(line=>{const ds=(line.match(/\d{4}-\d{2}-\d{2}|\d{1,2}[\/.]\d{1,2}[\/.]\d{4}/g)||[]).map(toDate).filter(Boolean);
        if(ds.length)found.push({start:ds[0],end:ds[1]&&ds[1]>=ds[0]?ds[1]:null})});
    }
  }
  return finishParse(found,days);
}
function finishParse(found,days){
  if(days.length){const u=[...new Set(days)].sort();let cur=null;
    for(const d of u){if(cur&&diff(d,cur.end)<=1)cur.end=d;else{cur={start:d,end:d};found.push(cur)}}}
  const t=todayISO();
  return mergePeriods([],found.filter(p=>p.start<=t&&p.start>"1990"));
}
function appleLines(lines,days){
  for(const l of lines){if(l.indexOf("MenstrualFlow")<0||/MenstrualFlowNone/.test(l))continue;
    const m=l.match(/startDate="(\d{4}-\d{2}-\d{2})/);if(m)days.push(m[1])}
}
async function scanXmlFile(file){
  const days=[];const reader=file.stream().getReader();const dec=new TextDecoder();let tail="";
  for(;;){const {done,value}=await reader.read();if(done)break;
    const chunk=tail+dec.decode(value,{stream:true});const parts=chunk.split("\n");tail=parts.pop();appleLines(parts,days)}
  appleLines([tail],days);return finishParse([],days);
}
let zipLib=null;
function loadZip(){
  if(window.JSZip)return Promise.resolve(window.JSZip);
  if(zipLib)return zipLib;
  zipLib=new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js";s.onload=()=>res(window.JSZip);s.onerror=()=>{zipLib=null;rej(new Error("load"))};document.head.appendChild(s)});
  return zipLib;
}
const NO_DATES="We couldn't find any period dates in that file. Check it's the export from your cycle app, or add dates by hand.";
async function readFile(file,cb){
  if(!file)return;
  try{
    const name=(file.name||"").toLowerCase();
    if(name.endsWith(".zip")){
      if(file.size>500e6){cb(null,"That zip is very large. Unzip it and upload the file with your cycle data instead.");return}
      let JSZip;try{JSZip=await loadZip()}catch(e){cb(null,"Zip files can't be opened here right now. Unzip it on your phone or computer and upload the file inside.");return}
      let zip;try{zip=await JSZip.loadAsync(file)}catch(e){cb(null,/encrypt/i.test(String(e&&e.message))?"This zip is password-protected. Unzip it with the password your app gave you, then upload the file inside.":"That zip couldn't be opened. Try unzipping it and uploading the file inside.");return}
      let all=[];
      for(const f of Object.values(zip.files)){
        if(f.dir||/__MACOSX|\/\._/.test(f.name)||!/\.(json|csv|xml|txt)$/i.test(f.name))continue;
        if(/\.xml$/i.test(f.name)&&!/export\.xml$/i.test(f.name))continue;
        const txt=await f.async("string");all=mergePeriods(all,parseExport(txt));
      }
      cb(all,all.length?null:NO_DATES);return;
    }
    if(name.endsWith(".xml")){const ps=await scanXmlFile(file);cb(ps,ps.length?null:NO_DATES);return}
    if(file.size>60e6){cb(null,"That file is too large. Try the export file with your cycle data on its own.");return}
    const ps=parseExport(await file.text());cb(ps,ps.length?null:NO_DATES);
  }catch(e){cb(null,"That file couldn't be read. Try choosing it again.")}
}

/* ---------- log sheet ---------- */
function openSheet(kind){ui.sheet=kind;renderSheet()}
function closeSheet(){ui.sheet=null;overlay.innerHTML="";document.body.style.overflow=""}
function renderSheet(){
  if(!ui.sheet){overlay.innerHTML="";return}
  document.body.style.overflow="hidden";
  const t=todayISO();
  let inner="";
  if(ui.sheet==="log"){
    const lg=(S.logs||{})[t]||{symptoms:[],sleep:null};
    const ps=(S.periods||[]).slice().sort((a,b)=>a.start<b.start?-1:1);const last=ps[ps.length-1];
    const open=last&&!last.end&&diff(t,last.start)<=10;
    const peri=S.stage==="peri";
    const symList=SYMPTOMS.filter(s=>s.k!=="sleep"&&(peri||!s.peri));
    inner=`<h2 id="sheet-h">Log today</h2>
    <div class="stack"><span class="label">Period</span>
      <div class="row">${open?`<button class="btn small" data-act="p-end">My period ended today</button>`:`<button class="btn small" data-act="p-start">My period started today</button>`}
      <button class="link small" data-act="p-other">Another date</button></div>
      ${ui.otherDate?`<div class="row"><input type="date" id="other-date" max="${t}" style="flex:1"><button class="btn small" data-act="p-other-save">Add</button></div>`:""}
    </div>
    <div class="stack"><span class="label">How are you feeling?</span><div class="row">${symList.map(s=>`<button class="chip" data-sym="${s.k}" aria-pressed="${(lg.symptoms||[]).includes(s.k)}">${s.n}</button>`).join("")}</div></div>
    <div class="stack"><span class="label">Last night's sleep</span><div class="seg">${[["bad","Badly"],["ok","OK"],["good","Well"]].map(x=>`<button class="chip" data-sleep="${x[0]}" aria-pressed="${lg.sleep===x[0]}">${x[1]}</button>`).join("")}</div></div>
    <button class="btn block" data-act="close">Done</button>`;
  }else if(ui.sheet==="import"){
    inner=`<h2 id="sheet-h">Import your history</h2><p class="small muted">We'll add any periods we find to what's already here.</p>
    ${trackerBlock("sheet",ui.tracker||S.tracker||"",ui.importMsg)}
    <button class="btn ghost block" data-act="close">Close</button>`;
  }else if(ui.sheet==="recipe"){
    const f=findFood(ui.recipe);const r=f&&f.r;
    if(!r){ui.sheet=null;overlay.innerHTML="";return}
    inner=`<div class="stack" style="gap:6px"><span class="label">Recipe · ${esc(f.n)}</span><h2 id="sheet-h">${esc(r.title)}</h2><p class="small muted">${esc(r.time)} · Serves ${r.serves}</p></div>
    <div class="stack"><h3>Ingredients</h3><ul class="clean">${r.ing.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
    <div class="stack"><h3>Method</h3><ol class="clean">${r.steps.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></div>
    <button class="btn block" data-act="close">Close</button>`;
  }else if(ui.sheet==="diet"){
    inner=`<h2 id="sheet-h">Food needs</h2><div class="stack"><span class="label">Allergies</span><div class="row">${ALLERGIES.map(x=>`<button class="chip" data-sal="${x[0]}" aria-pressed="${(S.allergies||[]).includes(x[0])}">${x[1]}</button>`).join("")}</div>
    <label class="small muted" for="soa">Anything else</label><input type="text" id="soa" value="${esc(S.otherAllergy||"")}" placeholder="Kiwi"></div>
    <div class="stack"><span class="label">Preferences</span><div class="row">${DIETS.map(x=>`<button class="chip" data-sdi="${x[0]}" aria-pressed="${(S.diets||[]).includes(x[0])}">${x[1]}</button>`).join("")}</div></div>
    <button class="btn block" data-act="diet-save">Save</button>`;
  }
  overlay.innerHTML=`<div class="sheet-wrap" data-act="backdrop"><div class="sheet stack-lg" role="dialog" aria-modal="true" aria-labelledby="sheet-h"><div class="grip"></div>${inner}</div></div>`;
}
function setLog(fn){S.logs=S.logs||{};const t=todayISO();const lg=S.logs[t]||{symptoms:[],sleep:null};fn(lg);S.logs[t]=lg;
  const keys=Object.keys(S.logs).sort();if(keys.length>400)keys.slice(0,keys.length-400).forEach(k=>delete S.logs[k]);
  if(S.sample){S.sample=false;S.source="Sample data"}save()}

/* ---------- main render & events ---------- */
function render(){
  let html;
  if(ui.booting&&!ui.ob)html=`<div class="top"><span class="brand">Cycle Kitchen</span></div><p class="muted">Loading your kitchen…</p>`;
  else if(ui.ob)html=viewOnboarding();
  else if(S.sample)html=viewWelcome();
  else if(ui.tab==="cycle")html=viewCycle();
  else if(ui.tab==="peri")html=viewPeri();
  else if(ui.tab==="supps")html=viewSupps();
  else if(ui.tab==="more")html=viewMore();
  else if(ui.tab==="article")html=viewArticle();
  else html=viewToday();
  app.innerHTML=html;renderTabs();renderSheet();
}
function go(tab){ui.tab=tab;ui.confirmDelete=false;render();scrollTo(0,0)}
function toggle(arr,k){const i=arr.indexOf(k);if(i>=0)arr.splice(i,1);else arr.push(k);return arr}
function ensureReal(){if(S.sample){startOnboarding();return false}return true}

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-mode],[data-food],[data-recipe],[data-tab],[data-act],[data-ob],[data-pick],[data-al],[data-di],[data-os],[data-sym],[data-sleep],[data-supp],[data-stage],[data-sal],[data-sdi]");
  if(!el)return;const ds=el.dataset;
  if(ds.act==="backdrop"&&e.target!==el)return;
  if(ds.mode){modePref=ds.mode;try{localStorage.setItem("ck-mode",modePref)}catch(e){}applyMode();render();return}
  if(ds.food){ui.food=ui.food===ds.food?null:ds.food;render();const b=document.querySelector(`[data-food="${ds.food}"]`);if(b)b.focus({preventScroll:true});return}
  if(ds.recipe){ui.recipe=ds.recipe;openSheet("recipe");return}
  if(ds.tab){closeSheet();go(ds.tab);return}
  if(ds.ob){if(ds.ob==="next")obNext();else if(ds.ob==="back"){obReadManual();ui.ob.i--;render();scrollTo(0,0)}else if(ds.ob==="cancel"){ui.ob=null;render();scrollTo(0,0)}else if(ds.ob==="addrow"){obReadManual();ui.ob.manual.push("");render()}else if(ds.ob==="finish")finishOnboarding();return}
  if(ds.pick){ui.ob.data.stage=ds.pick;render();return}
  if(ds.al){obReadManual();toggle(ui.ob.data.allergies,ds.al);render();return}
  if(ds.di){obReadManual();toggle(ui.ob.data.diets,ds.di);render();return}
  if(ds.os){toggle(ui.ob.data.supps,ds.os);render();return}
  if(ds.sym){if(S.sample&&!confirmLeaveSample())return;setLog(lg=>toggle(lg.symptoms,ds.sym));renderSheet();return}
  if(ds.sleep){if(S.sample&&!confirmLeaveSample())return;setLog(lg=>{lg.sleep=lg.sleep===ds.sleep?null:ds.sleep});renderSheet();return}
  if(ds.supp){if(!ensureReal())return;S.supps=toggle(S.supps||[],ds.supp);S.suppCheck=todayISO();save();render();return}
  if(ds.stage){if(!ensureReal())return;S.stage=ds.stage;save();render();return}
  if(ds.sal){S.allergies=toggle(S.allergies||[],ds.sal);renderSheet();return}
  if(ds.sdi){S.diets=toggle(S.diets||[],ds.sdi);renderSheet();return}
  switch(ds.act){
    case "start":startOnboarding();break;
    case "quick-start":quickStart();break;
    case "welcome-import":{const el=document.getElementById("w-date");ui.wDate=el?el.value:"";startImport();break}
    case "setup":startSetup();break;
    case "setup-later":ui.hideSetup=true;render();break;
    case "article":go("article");break;
    case "log":if(S.sample){startOnboarding();return}ui.otherDate=false;openSheet("log");break;
    case "import":if(!ensureReal())return;ui.importMsg="";ui.tracker=S.tracker||"";openSheet("import");break;
    case "edit-diet":if(!ensureReal())return;openSheet("diet");break;
    case "diet-save":{const o=document.getElementById("soa");S.otherAllergy=o?o.value.trim().slice(0,80):"";save();closeSheet();render();toast("Food needs saved");break}
    case "close":closeSheet();render();break;
    case "backdrop":closeSheet();render();break;
    case "p-start":{const t=todayISO();S.periods=mergePeriods(S.periods,[{start:t,end:null}]);save();closeSheet();render();toast("Period logged. Welcome to your menstrual phase.");break}
    case "p-end":{const t=todayISO();const ps=S.periods.slice().sort((a,b)=>a.start<b.start?-1:1);ps[ps.length-1].end=t;S.periods=ps;save();closeSheet();render();toast("Period end logged");break}
    case "p-other":ui.otherDate=!ui.otherDate;renderSheet();break;
    case "p-other-save":{const v=(document.getElementById("other-date")||{}).value;if(!v)return;S.periods=mergePeriods(S.periods,[{start:v,end:addDays(v,(S.periodLen||5)-1)}]);save();ui.otherDate=false;closeSheet();render();toast("Period added to your history");break}
    case "supp-yes":S.suppCheck=todayISO();save();render();toast("Thanks, noted");break;
    case "toggle-peri":if(!ensureReal())return;S.stage=S.stage==="peri"?"cycle":"peri";save();render();break;
    case "delete":ui.confirmDelete=true;render();break;
    case "delete-no":ui.confirmDelete=false;render();break;
    case "delete-yes":{ui.confirmDelete=false;const done=()=>{S=freshState();ui.tab="today";render();scrollTo(0,0);toast("Your data has been deleted")};
      try{localStorage.removeItem("ck-state")}catch(e){}
      if(store.mode==="db"&&store.ref){saving=saving.then(()=>store.ref.delete()).then(done,done)}else done();break}
  }
});
function confirmLeaveSample(){startOnboarding();return false}
document.addEventListener("change",e=>{
  if(e.target.id==="ob-tracker"){obReadManual();ui.ob.tracker=e.target.value;ui.ob.importMsg="";render();const el=document.getElementById("ob-tracker");if(el)el.focus();return}
  if(e.target.id==="sheet-tracker"){ui.tracker=e.target.value;ui.importMsg="";if(!S.sample){S.tracker=e.target.value;save()}renderSheet();const el=document.getElementById("sheet-tracker");if(el)el.focus();return}
  if(e.target.id==="ob-file"){readFile(e.target.files[0],(ps,err)=>{const o=ui.ob;obReadManual();
    if(ps&&ps.length){o.data.periods=mergePeriods(o.data.periods,ps);o.data.source=(TRACKERS.find(x=>x.k===o.tracker)||{n:"Imported file"}).n;o.importMsg=`Found ${ps.length} period${ps.length===1?"":"s"}, from ${fmt(ps[0].start,{month:"short",year:"numeric"})} to ${fmt(ps[ps.length-1].start,{month:"short",year:"numeric"})}.`}
    else o.importMsg=err;render()})}
  if(e.target.id==="sheet-file"){readFile(e.target.files[0],(ps,err)=>{
    if(ps&&ps.length){const before=(S.periods||[]).length;S.periods=mergePeriods(S.periods,ps);save();ui.importMsg=`Added ${S.periods.length-before} new period${S.periods.length-before===1?"":"s"}. Predictions updated.`;render()}
    else{ui.importMsg=err;renderSheet()}})}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&ui.sheet){closeSheet();render()}});

/* ---------- boot ---------- */
const local0=lsGet();
if(local0&&local0.onboarded){S=local0;store.mode="local";ui.booting=false}
if(!inClaude)ui.booting=false;
render();
setTimeout(()=>{if(ui.booting){ui.booting=false;render()}},6000);
(async function(){
  const local=local0;
  if(!inClaude)return;
  try{
    const [user,db]=await Promise.all([claude.use("user"),claude.use("db")]);
    if(user){store.me=await user.me();store.uid=store.me.id}
    if(db&&store.uid){
      store.db=db;store.ref=db.doc("data/users/"+store.uid+"/state");
      const snap=await store.ref.get();
      if(snap.exists&&snap.data()&&snap.data().onboarded){S=JSON.parse(JSON.stringify(snap.data()));store.mode="db"}
      else if(local&&local.onboarded){store.mode="db";S.sample=false;save()}
      else store.mode="db";
      if(S.sample)store.mode="db";
    }
    ui.booting=false;render();
  }catch(e){ui.booting=false;render()}
})();
})();
